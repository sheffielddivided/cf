name: update-data

# Ukentlig: hent IMF-data, normaliser, kontroller og eksporter (docs/DESIGN.md).
# På main committes data kun ved endring, og advarsler/feil meldes som Issues.
# Når et nytt felles kvartal kommer, åpnes et utkast til kvartalsoppsummering som PR
# (krever at "Allow GitHub Actions to create and approve pull requests" er slått på).
# På phase1/**-grener legges resultatet på bot/data-preview, slik at endringer kan
# testes uten å røre main.

on:
  schedule:
    - cron: "17 5 * * 1"   # mandag 05:17 UTC
  workflow_dispatch:
  push:
    # main: kjør på nytt når pipeline-kode eller konfigurasjon endres (f.eks. ved merge)
    branches: [main, "phase1/**", "phase2/**", "phase3/**"]
    paths:
      - "pipeline/**"
      - "config/**"
      - ".github/workflows/update-data.yml"
      - ".github/scripts/**"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked

      - name: Run pipeline
        id: run
        run: |
          set +e
          uv run pipeline update 2>&1 | tee pipeline.log
          code=${PIPESTATUS[0]}
          mkdir -p run && mv pipeline.log run/
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "pipeline exit code: $code"

      - name: Commit data (main)
        id: commit
        if: steps.run.outputs.code == '0' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/public/data
          [ -f REVISIONS.md ] && git add REVISIONS.md
          if git diff --cached --quiet; then
            echo "Ingen dataendringer."
          else
            git commit -F run/commit_message.txt
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open quarterly summary draft as PR (main, new quarter)
        # Never fatal: the data commit above is already pushed.
        if: steps.run.outputs.code == '0' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          q=$(python3 -c "import json;print(json.load(open('site/public/data/meta.json'))['last_common_quarter'])")
          dir=site/src/summaries
          if [ -f "$dir/$q.nb.md" ]; then echo "Oppsummering for $q finnes."; exit 0; fi
          if [ ! -f run/new_quarter.txt ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Ikke nytt kvartal."; exit 0
          fi
          branch="summary/$q"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch finnes allerede."; exit 0
          fi
          git checkout -b "$branch"
          mkdir -p "$dir"
          for lang in nb en; do
            { printf -- '---\nquarter: "%s"\nlang: %s\ngenerated: "%s"\n---\n\n' "$q" "$lang" "$(date -u +%F)"
              cat "run/summary_$lang.md"; } > "$dir/$q.$lang.md"
          done
          git add "$dir"
          git commit -qm "summary: draft for $q"
          git push -u origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "Kvartalsoppsummering $q (utkast)" \
            --body "Automatisk utkast laget fra tallene. Les gjennom, rett teksten om nødvendig og merge for å publisere. Ingenting vises på nettsiden før PR-en er merget.

          Sjekkliste:
          - [ ] Tallene stemmer med rangeringen på siden
          - [ ] Teksten beskriver og tolker ikke
          - [ ] Engelsk og norsk sier det samme"

      - name: Publish preview (branches)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src="${GITHUB_REF_NAME}@$(git rev-parse --short HEAD)"
          tmp=$(mktemp -d)
          for p in data site/public/data REVISIONS.md run; do
            [ -e "$p" ] && mkdir -p "$tmp/$(dirname "$p")" && cp -r "$p" "$tmp/$p"
          done
          git checkout --orphan bot/data-preview
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$tmp"/. .
          echo "Forhåndsvisning av pipeline-data fra ${src}, $(date -u +%FT%TZ). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > README.md
          git add -A
          git commit -qm "preview: pipeline data from ${src}"
          git push -f origin bot/data-preview

      - name: Report to Issues (main)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/report_issues.py run/summary.json

      - name: Fail if the pipeline failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "Pipeline feilet (exit ${{ steps.run.outputs.code }}). Se run/summary.json."
          exit 1

  deploy:
    # Publish the site with the new data (bot commits do not trigger deploy.yml by themselves).
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
