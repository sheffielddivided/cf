# Navn, flagg og ISO-tallkode (for kartet) for land. Selve utvalget (topp 20 etter BNP i referanseåret) beregnes og
# låses av pipelinen i data/processed/selection.json; land som kommer inn i topp 20 uten å
# stå her, får en advarsel og vises med landkode til navnet legges til.
extra: [NOR]           # valgbare ekstraland
aggregates: [EA]       # euroområdet (IMF-kode G163); summeres aldri med medlemslandene

