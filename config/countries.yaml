# Kandidatliste for landutvalget. Topp 20 etter nominelt BNP (USD) i referanseåret
# beregnes fra IMF-data i fase 0, og `in_top20` settes da. Ikke rediger for hånd uten grunn.
reference_year: null   # settes i fase 0
extra: [NOR]           # valgbare ekstraland
aggregates: [EA]       # euroområdet; summeres aldri med medlemslandene

